name: companion
board: 14port
# Voice drivers (the board talks to the ElevenLabs agent over WiFi) live in
# my_modules; WiFi + agent ID go in my_modules/microphone/voice_config.h.
modules_path: ./my_modules
# The speaker must stay listed before the microphone (the voice code uses `spk`).
modules:
  - {id: neopixel,   instance: led1, port: 1}
  - {id: neopixel,   instance: led2, port: 2}
  - {id: neopixel,   instance: led3, port: 3}
  - {id: neopixel,   instance: led4, port: 4}
  - {id: speaker,    instance: spk,  ports: [13, 14]}
  - {id: microphone, instance: mic,  ports: [5, 6]}
  - {id: button,     instance: btn,  port: 7}
  - {id: st7735_tft, instance: tft,  ports: [9, 10]}
  - {id: aht20,      instance: temp, port: 11}
code:
  setup: |
    // Watchdog: if loop() stops running for 20 s (a hang), restart the board.
    xTaskCreate([](void*) {
      for (;;) {
        vTaskDelay(pdMS_TO_TICKS(2000));
        if (millis() - loopBeatMs > 20000) {
          Serial.println("[Watchdog] loop stuck for 20 s, restarting");
          delay(50);
          ESP.restart();
        }
      }
    }, "loopdog", 2048, nullptr, 1, nullptr);
    loopBeatMs = millis();
    tft.clear();
    tft.displayText("Hi!", 4, 28, 3, ST7735_TFT::COLOR_WHITE);
    tft.display();
  loop: |
    static bool medDue = false;
    static unsigned long lightsOffAt = 0;
    static bool pinkOn = false;   // pink lamp on ports 1 and 2

    loopBeatMs = millis();   // heartbeat for the stuck-loop watchdog

    // Medicine lights: ports 1-3. Port 4 is the agent status light.
    auto fill = [](int r, int g, int b) {
      led1.setAll(r, g, b); led1.show();
      led2.setAll(r, g, b); led2.show();
      led3.setAll(r, g, b); led3.show();
    };

    // Port 4: a light circles while Mira's session is connected, off when not.
    static unsigned long spinAt = 0;
    static int spinPos = 0;
    static bool spinOn = false;
    if (voice.isSessionActive()) {
      if (millis() - spinAt >= 90) {
        static const uint8_t ring[8] = {0, 1, 2, 5, 8, 7, 6, 3};
        spinAt = millis();
        led4.clear();
        led4.setPixel(ring[spinPos], 0, 140, 255);
        led4.setPixel(ring[(spinPos + 7) % 8], 0, 50, 100);
        led4.setPixel(ring[(spinPos + 6) % 8], 0, 15, 30);
        led4.show();
        spinPos = (spinPos + 1) % 8;
        spinOn = true;
      }
    } else if (spinOn) {
      led4.clear();
      led4.show();
      spinOn = false;
    }

    // Word-wrapped text on the small screen. Short text big, longer text small.
    auto showText = [](String t) {
      t.trim();
      int size = t.length() <= 26 ? 2 : 1;
      int cols = 156 / (6 * size);
      int y = 4;
      tft.clear();
      tft.setTextSize(size);
      tft.setTextColor(ST7735_TFT::COLOR_WHITE);
      while (t.length() > 0 && y < 80) {
        int n = min((int)t.length(), cols);
        if (n < (int)t.length()) {
          int sp = t.lastIndexOf(' ', n);
          if (sp > 0) n = sp;
        }
        tft.setCursor(4, y);
        tft.print(t.substring(0, n).c_str());
        t = t.substring(n);
        t.trim();
        y += 8 * size + 4;
      }
      tft.display();
    };

    // `med_due` "<text>" (or 1): lights red and the text on screen until the
    // button is pressed. 0: cancel.
    if (atech_action == "med_due") {
      medDue = atech_value != "0" && atech_value.length() > 0;
      if (medDue) {
        fill(255, 0, 0);
        showText(atech_value == "1" ? String("Time for your medicine") : atech_value);
        spk.playRTTTL("due:d=8,o=5,b=120:e,g,4c6");
      } else {
        fill(0, 0, 0);
        if (pinkOn) { led1.setAll(255, 30, 120); led1.show(); led2.setAll(255, 30, 120); led2.show(); }
      }
      atechDone();
    }

    // Pink lamp on ports 1 and 2, toggled by the button when no medicine is due.
    auto showPink = []() {
      if (pinkOn) {
        led1.setAll(255, 30, 120); led1.show();
        led2.setAll(255, 30, 120); led2.show();
      }
    };

    // Button: logs the intake while medicine is due, otherwise toggles the pink lamp.
    if (btn.wasPressed()) {
      if (medDue) {
        medDue = false;
        fill(0, 255, 0);
        lightsOffAt = millis() + 3000;
        showText("Medicine taken. Well done!");
        spk.playRTTTL("ok:d=16,o=5,b=140:c,e,g,4c6");
        Serial.println("{\"type\":\"event\",\"payload\":{\"event_type\":\"sensor\",\"key\":\"med_taken\",\"value\":1}}");
      } else {
        pinkOn = !pinkOn;
        if (pinkOn) showPink();
        else { led1.clear(); led1.show(); led2.clear(); led2.show(); }
      }
    }
    if (lightsOffAt && millis() > lightsOffAt) {
      lightsOffAt = 0;
      fill(0, 0, 0);
      showPink();   // back to the pink lamp if it was on
    }

    // `lights` "r,g,b" sets all four light grids.
    if (atech_action == "lights") {
      int r = 0, g = 0, b = 0;
      sscanf(atech_value.c_str(), "%d,%d,%d", &r, &g, &b);
      fill(r, g, b);
      atechDone();
    }

    // `show` "text" puts text on the screen.
    if (atech_action == "show") {
      showText(atech_value);
      atechDone();
    }

    // `voice_test` opens a Mira session without waiting for the mic to hear a voice.
    if (atech_action == "voice_test") {
      voice.startTalking();
      atechDone();
    }

    // `med_state` reports whether medicine is due right now.
    if (atech_action == "med_state") {
      Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"sensor\",\"key\":\"med_state\",\"value\":%d}}\n", medDue ? 1 : 0);
      atechDone();
    }
